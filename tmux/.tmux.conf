unbind r
# Reload config. Unset the catppuccin palette first so the flavor can re-follow the
# current macOS appearance on reload (catppuccin sets @thm_* with -o, i.e. it won't
# overwrite an already-set value, so a stale palette would otherwise stick).
bind r run-shell "tmux show -g | grep '^@thm_' | cut -d' ' -f1 | xargs -n1 tmux set -gu; tmux source-file ~/.tmux.conf; tmux display-message ' ✱ tmux.conf is reloaded'"

set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'

set -g mouse on
set -sg escape-time 0
set -g renumber-windows on
set -g focus-event on

set-window-option -g mode-keys vi

# Vim-style pane navigation with smart wrapping
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# Don't exit copy mode when dragging with mouse
# unbind -T copy-mode-vi MouseDragEnd1Pane

# Create new panes in current directory
bind c command-prompt -p "Window name:" \
  "new-window -c '#{pane_current_path}' -n '%%'"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Floating terminal (popup) — needs tmux 3.2+
# prefix + g : persistent scratch shell, keeps its state across toggles,
#              opens in the current pane's directory, centered 80% x 75%
bind g display-popup -d "#{pane_current_path}" -w 80% -h 75% \
  -E "tmux new-session -A -s scratch"
# prefix + G : throwaway shell in current dir (fresh every time)
bind G display-popup -d "#{pane_current_path}" -w 80% -h 75% -E

set-option -g status-position bottom
set -g status-left-length 100
set -g status-right-length 50

set -g status-left '#{?client_prefix,#[fg=red] @ ,  }'
set -g status-right '#{pane_current_command} #P | #S '

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @catppuccin_window_status_style "basic" # basic, rounded, slanted, custom, or none
set -g @catppuccin_window_text " #{window_name} "
set -g @catppuccin_window_current_text " #{window_name} "
set -g @catppuccin_window_flags "icon" # none, icon, or text

# Follow macOS appearance for catppuccin flavor (matches the kitty auto dark/light
# setup): dark -> mocha, light -> latte, falls back to latte off macOS.
# if-shell runs async, so set the flavor AND load the plugin in the same branch to
# guarantee the flavor is applied before the palette is generated.
# need Manual install: https://github.com/catppuccin/tmux
if-shell 'test "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = "Dark"' \
  "set -g @catppuccin_flavor mocha ; run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux" \
  "set -g @catppuccin_flavor latte ; run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

run '~/.tmux/plugins/tpm/tpm'
