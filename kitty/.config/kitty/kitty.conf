# Kitty config derived from the existing Ghostty and Alacritty setup.

# Font
font_family Maple Mono NF CN
font_size 14.5

# Window
remember_window_size no
initial_window_width 170c
initial_window_height 50c
window_padding_width 0

# Cursor
cursor_shape block
cursor_blink_interval 0.75
cursor_stop_blinking_after 0

# macOS
macos_option_as_alt both

# Clipboard & selection
copy_on_select clipboard
paste_actions quote-urls-at-prompt,confirm
strip_trailing_spaces always

# Mouse
mouse_hide_wait -1
mouse_map left click ungrabbed mouse_handle_click selection link
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link
mouse_map ctrl+middle release ungrabbed paste_from_clipboard

# Scrollback
scrollback_lines 10000

# Shell integration & notifications
shell_integration enabled
notify_on_cmd_finish unfocused 5.0

# Title
startup_session startup.session
