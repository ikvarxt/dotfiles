# Rime schema
# encoding: utf-8

schema:
  schema_id: double_pinyin_flypy_dvorak
  name: 小鹤双拼・Programmer Dvorak
  version: "1.2"
  author:
    - double pinyin layout by 鹤
    - Programmer Dvorak integration by Codex
    - Rime schema based on rime/rime-double-pinyin
  description: |
    英文和小鹤双拼编码均使用 Programmer Dvorak 的逻辑键位。
  dependencies:
    - stroke
    - melt_eng_dvorak

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, EN ]
    abbrev: [ 中文, EN ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 1
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - lua_processor@*select_character
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
    - lua_translator@*date_translator
    - lua_translator@*lunar
    - lua_translator@*uuid
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - lua_translator@*unicode
    - lua_translator@*number_translator
    - lua_translator@*calc_translator
  filters:
    - lua_filter@*autocap_filter
    - simplifier
    - uniquifier

speller:
  # Squirrel 按 Programmer Dvorak 将物理按键转换为逻辑字母，
  # 小鹤双拼直接使用这些 Dvorak 逻辑字母，不再映射回 QWERTY 位置。
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ`"
  initials: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Ⓠ/
    - xform/(.)ei$/$1Ⓦ/
    - xform/uan$/Ⓡ/
    - xform/[uv]e$/Ⓣ/
    - xform/un$/Ⓨ/
    - xform/^sh/Ⓤ/
    - xform/^ch/Ⓘ/
    - xform/^zh/Ⓥ/
    - xform/uo$/Ⓞ/
    - xform/ie$/Ⓟ/
    - xform/i?ong$/Ⓢ/
    - xform/ing$|uai$/Ⓚ/
    - xform/(.)ai$/$1Ⓓ/
    - xform/(.)en$/$1Ⓕ/
    - xform/(.)eng$/$1Ⓖ/
    - xform/[iu]ang$/Ⓛ/
    - xform/(.)ang$/$1Ⓗ/
    - xform/ian$/Ⓜ/
    - xform/(.)an$/$1Ⓙ/
    - xform/(.)ou$/$1Ⓩ/
    - xform/[iu]a$/Ⓧ/
    - xform/iao$/Ⓝ/
    - xform/(.)ao$/$1Ⓒ/
    - xform/ui$/Ⓥ/
    - xform/in$/Ⓑ/
    - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/

translator:
  dictionary: rime_ice_dvorak
  # 沿用已有的学习词库，现有加密备份与恢复流程无需迁移。
  user_dict: luna_pinyin
  prism: double_pinyin_flypy_dvorak
  enable_word_completion: true
  initial_quality: 1.2

date_translator:
  date: date
  time: time
  week: week
  datetime: datetime
  timestamp: timestamp
  datezh: datezh
  dateen: dateen

lunar: lunar
lunar_template: "{干支年}{生肖}年{俗称农历月}{农历日}"

uuid: uuid

calculator:
  prefix: cC
  show_prefix: false

melt_eng:
  dictionary: melt_eng_dvorak
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 0.8
  comment_format:
    - xform/.*//

cn_en:
  dictionary: ""
  user_dict: rime_ice_vendor/en_dicts/cn_en_flypy
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.6
  comment_format:
    - xform/^.+$//

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_double
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
  comment_format:
    - xform/([nl])v/$1ü/

punctuator:
  import_preset: default
  half_shape:
    _: "_"

key_binder:
  import_preset: default
  select_first_character: Control+comma
  select_last_character: Control+period
  bindings:
    # Programmer Dvorak 顶部数字行在不按 Shift 时输出符号。
    # 仅在候选窗出现时，将物理 1–9 依次映射为候选 1–9；
    # 平时仍然可以直接输入这些符号。
    - { when: has_menu, accept: ampersand, send: "1" }
    - { when: has_menu, accept: bracketleft, send: "2" }
    - { when: has_menu, accept: braceleft, send: "3" }
    - { when: has_menu, accept: braceright, send: "4" }
    - { when: has_menu, accept: parenleft, send: "5" }
    - { when: has_menu, accept: equal, send: "6" }
    - { when: has_menu, accept: asterisk, send: "7" }
    - { when: has_menu, accept: parenright, send: "8" }
    - { when: has_menu, accept: plus, send: "9" }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }

editor:
  bindings:
    space: confirm
    Return: commit_raw_input
    Control+Return: commit_script_text
    Control+Shift+Return: commit_comment
    BackSpace: revert
    Delete: delete
    Control+BackSpace: back_syllable
    Control+Delete: delete_candidate
    Escape: cancel

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
    unicode: "^U[a-f0-9]+"
    number: "^R[0-9]+[.]?[0-9]*"
    calculator: "^cC.+"
    gregorian_to_lunar: "^N[0-9]{1,8}"
